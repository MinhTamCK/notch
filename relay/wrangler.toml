# Deploy: cd relay && npx wrangler deploy  (secrets: see src/worker.js)
name = "relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "HUB"
