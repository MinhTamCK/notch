<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notch Fleet</title>
<style>
:root{
  --bg:#0b0c0f;--panel:#14161b;--line:#23262d;--fg:#e8eaee;--dim:#7b8190;
  --working:#8b93a1;--perm:#f5a524;--attn:#a78bfa;--done:#3ecf8e;--stale:#4a5060;--ended:#343843;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
#summary{color:var(--dim)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--stale);margin-left:auto}
#dot.on{background:var(--done)}
#usage{display:flex;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);color:var(--dim);flex-wrap:wrap}
.bar{display:inline-flex;gap:2px;vertical-align:middle;margin:0 6px}
.bar i{width:7px;height:10px;background:var(--line);display:block}
.bar i.f{background:var(--done)} .bar i.hi{background:var(--perm)} .bar i.crit{background:#ef4444}
main{padding:16px 18px;display:flex;flex-direction:column;gap:22px}
#machines{display:flex;flex-direction:column;gap:22px}
#usage:empty{display:none}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--working));border-radius:6px;padding:10px 12px;display:flex;gap:12px}
.card canvas{width:56px;height:63px;image-rendering:pixelated;flex:none}
.card .t{min-width:0;flex:1}
.card .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--c);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.card .m{color:var(--dim);font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .a{color:var(--dim);font-size:11px}
.card.working{--c:var(--working)} .card.needs_permission{--c:var(--perm)} .card.needs_attention{--c:var(--attn)}
.card.done{--c:var(--done)} .card.stale{--c:var(--stale);opacity:.55} .card.ended{--c:var(--ended);opacity:.45}
.card.needs_permission,.card.needs_attention{box-shadow:0 0 0 1px var(--c) inset}
.perm{background:var(--panel);border:1px solid var(--perm);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.perm pre{margin:0;max-height:160px;overflow:auto;background:#0b0c0f;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;font-size:12px}
.perm .row{display:flex;gap:8px;align-items:center}
.perm .who{color:var(--perm);font-weight:700}
button{font:inherit;border:1px solid var(--line);background:#1b1e25;color:var(--fg);padding:6px 14px;border-radius:5px;cursor:pointer}
button.allow{border-color:var(--done);color:var(--done)} button.deny{border-color:#ef4444;color:#ef4444}
button:hover{filter:brightness(1.25)}
#login{max-width:420px;margin:15vh auto;padding:0 18px;display:none}
#login input{width:100%;font:inherit;padding:9px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:5px;margin:10px 0}
.empty{color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.legend b{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div id="login">
  <h1>Notch Fleet</h1>
  <p>Operator token (kept only in this browser):</p>
  <input id="tok" type="password" autocomplete="off" placeholder="NOTCH_OPERATOR_TOKEN">
  <button id="go">Connect</button>
</div>
<div id="app" style="display:none">
<header>
  <h1>Notch Fleet</h1><span id="summary">connecting…</span>
  <div class="legend" id="legend"></div><span id="dot"></span>
</header>
<div id="usage"></div>
<main>
  <section id="permsec" style="display:none"><h2>Needs your decision</h2><div id="perms" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))"></div></section>
  <div id="machines"></div>
</main>
</div>
<script>
'use strict'
const COLORS={working:'#8b93a1',needs_permission:'#f5a524',needs_attention:'#a78bfa',done:'#3ecf8e',stale:'#4a5060',ended:'#343843'}
const LABEL={working:'working',needs_permission:'needs permission',needs_attention:'your turn',done:'done',stale:'stale',ended:'ended'}
const ORDER=['needs_permission','needs_attention','working','done','stale','ended']
const sessions=new Map(), perms=new Map(); let usage=null, ws=null, retry=1000, tick=0

// ---- pixel sprite: 14x12 grid, drawn per state; the body colour IS the status ----
const BODY=[ // rows of the crab-like mascot; '#'=body, 'e'=eye socket
'..############..',
'.##############.',
'.##ee######ee##.',
'.##ee######ee##.',
'.##############.',
'.##############.',
'..############..',
]
function sprite(cv,state,frame){
  const S=4, W=16, H=18; cv.width=W*S; cv.height=H*S
  const g=cv.getContext('2d'); g.clearRect(0,0,cv.width,cv.height)
  const c=COLORS[state], px=(x,y,col)=>{g.fillStyle=col;g.fillRect(x*S,(y+5)*S,S,S)}
  const bob=(state==='working'&&frame%2)?-1:0
  BODY.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==='#')px(x,y+bob+1,c)
    else if(ch==='e')px(x,y+bob+1,state==='ended'||state==='stale'?c:'#0b0c0f')
  }))
  // pupils / expression
  const eye=(x,y)=>px(x,y+bob+1,'#fff')
  if(state==='ended'||state==='stale'){ // x x
    ;[[3,2],[4,3],[3,3],[4,2],[11,2],[12,3],[11,3],[12,2]].forEach(([x,y])=>{if((x+y)%2===0)px(x,y+bob+1,'#0b0c0f')})
  } else if(state==='done'){ eye(3,3);eye(12,3); px(6,5+bob+1,'#0b0c0f');px(9,5+bob+1,'#0b0c0f');px(7,6+bob+1,'#0b0c0f');px(8,6+bob+1,'#0b0c0f') // smile
  } else { const l=state==='working'?(frame%4<2?0:1):0; eye(3+l,2);eye(3+l,3);eye(11+l,2);eye(11+l,3) }
  // legs
  const leg=(x,off)=>{px(x,8+bob+1+off,c);px(x,9+bob+1+off,c)}
  const w=state==='working'
  ;[2,5,9,12].forEach((x,i)=>leg(x,w&&((i+frame)%2)?1:0))
  // signals above the head
  if(state==='needs_permission'){ // raised claw + "!"
    [[14,-3],[14,-2],[14,-1]].forEach(([x,y])=>px(x,y,'#f5a524')); px(14,1,'#f5a524')
    if(frame%2){px(13,-3,'#f5a524');px(15,-3,'#f5a524')}
  } else if(state==='needs_attention'){ // "?"
    [[6,-3],[7,-3],[8,-3],[8,-2],[7,-1],[7,0]].forEach(([x,y])=>px(x,y,'#a78bfa')); px(7,1,'#a78bfa')
    if(frame%2){px(6,-3,'#c4b5fd');px(8,-3,'#c4b5fd')}
  } else if(state==='done'&&frame%2){ px(1,-2,'#3ecf8e');px(14,-2,'#3ecf8e');px(2,-1,'#3ecf8e');px(13,-1,'#3ecf8e') }
}

// ---- helpers (all DOM via textContent: no untrusted HTML) ----
const $=id=>document.getElementById(id)
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const base=p=>(p||'').split('/').filter(Boolean).pop()||'—'
function ago(ms){const s=Math.max(0,Math.floor((Date.now()-ms)/1000));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function preview(p){const i=p.toolInput||{};return i.command||i.file_path||i.plan||(typeof i==='string'?i:JSON.stringify(i,null,1))||''}

function render(){
  const list=[...sessions.values()].filter(s=>s.state!=='stale'||true)
  const needs=list.filter(s=>s.state==='needs_permission'||s.state==='needs_attention').length
  const working=list.filter(s=>s.state==='working').length
  $('summary').textContent=`${working} working · ${needs} need you · ${list.length} sessions`
  document.title=(needs?`(${needs}) `:'')+'Notch Fleet'
  // usage
  const u=$('usage'); u.replaceChildren()
  if(usage)for(const [k,lab] of [['five_hour','5h'],['seven_day','7d']]){const w=usage[k];if(!w)continue
    const box=el('span',null,lab);const bar=el('span','bar');const pct=Math.round(w.used_percentage)
    for(let i=0;i<10;i++){const b=el('i');if(i<Math.round(pct/10))b.className=pct>=90?'crit':pct>=70?'hi':'f';bar.append(b)}
    box.append(bar,el('span',null,pct+'%'));u.append(box)}
  // permissions
  const pl=$('perms');pl.replaceChildren();const pa=[...perms.values()].sort((a,b)=>a.createdAt-b.createdAt)
  $('permsec').style.display=pa.length?'block':'none'
  for(const p of pa){const c=el('div','perm');const r=el('div','row');
    r.append(el('span','who',p.machine+' · '+base(p.cwd)),el('span',null,p.toolName),el('span','a',ago(p.createdAt)))
    const pre=el('pre',null,String(preview(p)).slice(0,1500))
    const row=el('div','row');const a=el('button','allow','Allow'),d=el('button','deny','Deny'),t=el('button',null,'Ask in terminal')
    a.onclick=()=>decide(p.id,'allow');d.onclick=()=>decide(p.id,'deny');t.onclick=()=>decide(p.id,'timeout');row.append(a,d,t)
    c.append(r,pre,row);pl.append(c)}
  // machines
  const byM=new Map();for(const s of list){if(!byM.has(s.machine))byM.set(s.machine,[]);byM.get(s.machine).push(s)}
  const root=$('machines');root.replaceChildren()
  if(!list.length){root.append(el('div','empty','No sessions yet. Hooks on each machine report here.'));return}
  for(const [m,arr] of [...byM].sort((a,b)=>a[0].localeCompare(b[0]))){
    arr.sort((a,b)=>ORDER.indexOf(a.state)-ORDER.indexOf(b.state)||b.updatedAt-a.updatedAt)
    const sec=el('section');sec.append(el('h2',null,m+' · '+arr.length));const grid=el('div','grid')
    for(const s of arr){const c=el('div','card '+s.state);const cv=el('canvas');cv.dataset.state=s.state;sprite(cv,s.state,tick)
      const t=el('div','t');t.append(el('div','n',base(s.cwd)||s.sessionId.slice(0,8)),el('div','s',LABEL[s.state]+' · '+ago(s.updatedAt)),
        el('div','m',s.lastMessage||(s.lastTool?'tool: '+s.lastTool:'')),el('div','a',s.agent+(s.lastTool&&s.lastMessage?' · '+s.lastTool:'')))
      c.append(cv,t);grid.append(c)}
    sec.append(grid);root.append(sec)}
}
function animate(){tick++;document.querySelectorAll('canvas[data-state]').forEach(cv=>sprite(cv,cv.dataset.state,tick))}
setInterval(animate,500);setInterval(render,15000)

// legend
for(const k of ORDER){const s=el('span');const b=el('b');b.style.background=COLORS[k];s.append(b,LABEL[k]);$('legend').append(s)}

// ---- transport ----
let token=''
function decide(id,decision){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'decide',id,decision}))}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(token))
  let opened=false
  ws.onopen=()=>{opened=true;retry=1000;$('dot').className='on'}
  ws.onclose=()=>{$('dot').className='';
    if(!opened&&retry>=4000){try{localStorage.removeItem('notchOpToken')}catch(e){};showLogin('Connection refused — check the token.');return}
    setTimeout(connect,retry);retry=Math.min(retry*2,15000)}
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='snapshot'){sessions.clear();perms.clear();(m.sessions||[]).forEach(s=>sessions.set(s.key,s));(m.permissions||[]).forEach(p=>perms.set(p.id,p));usage=m.usage||null}
    else if(m.type==='session')sessions.set(m.session.key,m.session)
    else if(m.type==='session_removed')sessions.delete(m.key)
    else if(m.type==='permission')perms.set(m.request.id,m.request)
    else if(m.type==='permission_resolved')perms.delete(m.id)
    else if(m.type==='usage')usage=m.usage
    render()}
}
function showLogin(msg){$('app').style.display='none';$('login').style.display='block';if(msg)$('login').querySelector('p').textContent=msg}
function start(){$('login').style.display='none';$('app').style.display='block';connect()}
$('go').onclick=()=>{token=$('tok').value.trim();if(!token)return;try{localStorage.setItem('notchOpToken',token)}catch(e){};start()}
try{const h=new URLSearchParams(location.hash.slice(1)).get('token');if(h){localStorage.setItem('notchOpToken',h);history.replaceState(null,'',location.pathname)}token=localStorage.getItem('notchOpToken')||''}catch(e){}
token?start():showLogin()
</script>
</body>
</html>
